name: Inventory release archive
on:
  push:
    paths:
      - .github/workflows/archive-inventory.yml
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List archive contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.0 --pattern 'cardsharry.zip' --dir /tmp
          unzip -Z1 /tmp/cardsharry.zip > archive-inventory.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive-inventory.txt
          git commit -m 'Inventory card archive'
          git push origin HEAD:${{ github.ref_name }}
