name: Build duplex cards from release
on:
  push:
    paths:
      - .github/workflows/inspect-cards.yml
      - scripts/make_duplex.py
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release PDFs and build printable sheets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/cards
          gh release download 1.0 --pattern '*.pdf' --dir /tmp/cards
          python -m pip install pymupdf pillow numpy scipy
          python scripts/make_duplex.py /tmp/cards
      - name: Save finished PDF on this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add print_ready/all_characters_A4_duplex.pdf
          git commit -m 'Build A4 duplex sheets for all characters'
          git push origin HEAD:${{ github.ref_name }}
