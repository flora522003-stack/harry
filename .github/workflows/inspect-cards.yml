name: Inspect card release
on:
  push:
    paths:
      - .github/workflows/inspect-cards.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and render card PDFs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/cards .inspection/pages
          gh release download 1.0 --pattern '*.pdf' --dir /tmp/cards
          python -m pip install pymupdf pillow
          python - <<'PY'
          import pymupdf as fitz, glob, os
          from PIL import Image
          for name in glob.glob('/tmp/cards/*.pdf'):
              doc=fitz.open(name); pix=doc[0].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
              Image.frombytes('RGB',(pix.width,pix.height),pix.samples).save('.inspection/pages/'+os.path.basename(name)+'.jpg',quality=91)
          PY
      - name: Save previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .inspection/pages
          git commit -m 'Render release card previews'
          git push origin HEAD:${{ github.ref_name }}
